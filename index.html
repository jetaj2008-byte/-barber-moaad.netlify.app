<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BARBER MOAAD | حجز المواعيد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--red:#c8102e;--bg:#eef1f6;--card:#fff;--line:#d5dbe6;--ok:#1f7a4d;--mut:#6b7587}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.pole{height:10px;background:repeating-linear-gradient(-45deg,var(--red) 0 12px,#fff 12px 24px,var(--ink) 24px 36px)}
header{background:var(--ink);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 22px;text-align:center}
h1{margin:0;font-size:34px;font-weight:900;letter-spacing:1px}
header p{margin:4px 0 0;color:#b9c3d8}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid var(--line)}
h2{font-size:18px;margin:0 0 12px}
input,select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff;color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--ink);color:#fff;font-weight:700}
button.red{background:var(--red)}button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.4}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.day{min-width:64px;padding:10px 6px;text-align:center;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px}
.day b{display:block;font-size:20px}
.day.on{background:var(--red);color:#fff;border-color:var(--red)}
.day.off{opacity:.35}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:12px 4px;background:#fff;color:var(--ink);border:1px solid var(--line);font-size:16px}
.slot.on{background:var(--ink);color:#fff}
.slot.x{background:#e4e8ef;color:#98a1b3;text-decoration:line-through}
.slot.blk{background:#fde7ea;color:var(--red);border-color:#f3b8c0}
.slot.bk{background:#fff7e0;border-color:#e8c766;text-align:right;font-size:14px;line-height:1.5}
.slot.free{border-color:var(--ok);color:var(--ok)}
.msg{padding:12px;border-radius:10px;margin-bottom:12px}
.msg.e{background:#fde7ea;color:#8a0b20}.msg.g{background:#e3f4ea;color:#14573a}
.mut{color:var(--mut);font-size:14px}
footer{text-align:center;padding:18px;color:var(--mut);font-size:13px}
footer a{color:var(--mut)}
.wk{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.wk label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:14px}
.wk input{width:auto;margin:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
</style>
</head>
<body>
<div class="pole"></div>
<header><h1>BARBER MOAAD</h1><p>احجز موعدك بدقيقة</p></header>
<main id="app"></main>
<footer>جميع الحقوق محفوظة © BARBER MOAAD<br><a href="#admin" id="lnk">دخول المالك</a></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
if(typeof firebase==='undefined'){document.getElementById('app').innerHTML='<div class="card"><h2>معاينة التصميم</h2><p>الحجز الفعلي بيشتغل بعد نشر الملف على موقعك مع Firebase.</p></div>';throw new Error('preview mode');}
firebase.initializeApp({
  apiKey:"AIzaSyDT26aQclURFZwLC9BQSvtn6lvQ33nBUq4",
  authDomain:"barber-moaad.firebaseapp.com",
  projectId:"barber-moaad",
  storageBucket:"barber-moaad.firebasestorage.app",
  messagingSenderId:"416638478149",
  appId:"1:416638478149:web:63dcbe920cf38fa2f1002c"
});
const db=firebase.firestore(),au=firebase.auth();
const $=s=>document.querySelector(s),app=$('#app');
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const m2t=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const t2m=t=>{const a=t.split(':');return +a[0]*60+ +a[1]};
const DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cfg={open:'10:00',close:'20:00',dur:30,bf:'',bt:'',off:[5]};
let sel=null,pick=null;

async function loadCfg(){try{const s=await db.doc('settings/config').get();if(s.exists)cfg={...cfg,...s.data()}}catch(e){}}
async function dayInfo(d){const dt=new Date(d+'T00:00:00');let c={...cfg,closed:cfg.off.includes(dt.getDay())};
  try{const s=await db.doc('days/'+d).get();if(s.exists)c={...c,...s.data()}}catch(e){}return c}
function times(c){const r=[];for(let m=t2m(c.open);m+ +c.dur<=t2m(c.close);m+=+c.dur){
  if(c.bf&&c.bt&&m<t2m(c.bt)&&m+ +c.dur>t2m(c.bf))continue;r.push(m2t(m))}return r}
function msg(t,k){return '<div class="msg '+k+'">'+t+'</div>'}

/* ---------- الزبون ---------- */
async function customer(){
  await loadCfg();
  const today=new Date();let ds14=[];
  for(let i=0;i<14;i++){const d=new Date(today);d.setDate(d.getDate()+i);ds14.push(d)}
  sel=sel||ds(today);pick=null;
  app.innerHTML=`<div class="card"><h2>بياناتك</h2>
  <div class="row"><input id="fn" placeholder="الاسم الأول" maxlength="30" autocomplete="given-name"><input id="ln" placeholder="اسم العيلة" maxlength="30" autocomplete="family-name"></div>
  <input id="ph" type="tel" inputmode="tel" placeholder="رقم الهاتف" maxlength="20" autocomplete="tel"></div>
  <div class="card"><h2>اختار اليوم</h2><div class="days" id="days"></div></div>
  <div class="card"><h2>اختار الساعة</h2><div id="slots" class="mut">جاري التحميل...</div></div>
  <div id="out"></div><button class="red" id="go" style="width:100%;font-size:18px" disabled>تأكيد الحجز</button>`;
  $('#days').innerHTML=ds14.map(d=>`<button class="day ghost ${ds(d)===sel?'on':''}" data-d="${ds(d)}">${DN[d.getDay()]}<b>${d.getDate()}</b>${d.getMonth()+1}/</button>`).join('');
  $('#days').onclick=e=>{const b=e.target.closest('.day');if(b){sel=b.dataset.d;pick=null;customer()}};
  $('#go').onclick=book;
  const c=await dayInfo(sel),box=$('#slots');
  if(c.closed){box.innerHTML='المحل مسكّر هاليوم، اختار يوم تاني.';return}
  let taken=new Set();
  try{const q=await db.collection('slots').where('date','==',sel).get();q.forEach(x=>taken.add(x.id))}catch(e){box.textContent='صار خطأ بالتحميل، حدّث الصفحة.';return}
  const now=new Date(),isT=sel===ds(now),nm=now.getHours()*60+now.getMinutes();
  const ts=times(c).filter(t=>!(isT&&t2m(t)<=nm));
  box.className='slots';
  box.innerHTML=ts.length?ts.map(t=>{const id=sel+'_'+t.replace(':','');const x=taken.has(id);
    return `<button class="slot ${x?'x':''}" data-t="${t}" ${x?'disabled':''}>${t}</button>`}).join(''):'ما في مواعيد متاحة هاليوم.';
  box.onclick=e=>{const b=e.target.closest('.slot');if(!b||b.disabled)return;pick=b.dataset.t;
    document.querySelectorAll('.slot').forEach(s=>s.classList.toggle('on',s===b));$('#go').disabled=false}
}
async function book(){
  const fn=$('#fn').value.trim(),ln=$('#ln').value.trim(),ph=$('#ph').value.trim();
  const out=$('#out');
  if(!fn||!ln||ph.replace(/\D/g,'').length<7){out.innerHTML=msg('اكتب الاسم واسم العيلة ورقم هاتف صحيح.','e');return}
  if(!pick){out.innerHTML=msg('اختار ساعة.','e');return}
  const id=sel+'_'+pick.replace(':',''),b=db.batch();
  b.set(db.doc('slots/'+id),{date:sel});
  b.set(db.doc('bookings/'+id),{date:sel,time:pick,fn,ln,ph,ts:Date.now()});
  $('#go').disabled=true;
  try{await b.commit();
    app.innerHTML=`<div class="card"><h2>تم الحجز ✅</h2><p>${esc(fn)} ${esc(ln)}، موعدك يوم <b>${DN[new Date(sel+'T00:00:00').getDay()]} ${sel}</b> الساعة <b>${pick}</b>.</p><p class="mut">إذا بدك تلغي، احكي مع معاذ مباشرة.</p><button onclick="sel=null;customer()">حجز جديد</button></div>`}
  catch(e){out.innerHTML=msg('هالموعد انحجز قبل شوي، اختار ساعة تانية.','e');customer()}
}

/* ---------- المالك ---------- */
function loginView(m){
  app.innerHTML=`<div class="card"><h2>دخول المالك</h2>${m||''}
  <input id="em" type="email" placeholder="الإيميل" autocomplete="username"><input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password">
  <button id="in" style="width:100%">دخول</button></div>`;
  $('#in').onclick=()=>au.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(()=>loginView(msg('الإيميل أو كلمة السر غلط.','e')));
}
async function admin(){
  await loadCfg();sel=sel||ds(new Date());
  const c=await dayInfo(sel);
  const [sq,bq]=await Promise.all([db.collection('slots').where('date','==',sel).get(),db.collection('bookings').where('date','==',sel).get()]);
  const blocked=new Set(),bk={};
  sq.forEach(x=>{if(x.data().blocked)blocked.add(x.id)});bq.forEach(x=>bk[x.id]=x.data());
  const ts=times(c);
  app.innerHTML=`<div class="card"><h2>اليوم</h2><input type="date" id="dp" value="${sel}">
  ${c.closed?msg('هاليوم مسكّر.','e'):''}
  <div class="row"><button class="${c.closed?'':'red'}" id="cl">${c.closed?'افتح اليوم':'سكّر اليوم كله'}</button></div>
  <p class="mut">اضغط على ساعة فاضية عشان تسكرها (صلاة، أكل...) وكبسة تانية بتفتحها.</p>
  <div class="slots" id="sl">${ts.map(t=>{const id=sel+'_'+t.replace(':','');const b=bk[id];
   if(b)return `<button class="slot bk" data-c="${id}"><b>${t}</b><br>${esc(b.fn)} ${esc(b.ln)}<br><a href="tel:${esc(b.ph)}">${esc(b.ph)}</a><br><span style="color:var(--red)">إلغاء</span></button>`;
   return `<button class="slot ${blocked.has(id)?'blk':'free'}" data-b="${id}">${t}<br><small>${blocked.has(id)?'مسكّر':'فاضي'}</small></button>`}).join('')}</div></div>
  <div class="card"><h2>ساعات هاليوم فقط</h2><div class="row"><input type="time" id="o" value="${c.open}"><input type="time" id="c" value="${c.close}"></div><button id="sd" class="ghost">حفظ ساعات اليوم</button></div>
  <div class="card"><h2>الدوام العادي</h2><div class="row"><input type="time" id="so" value="${cfg.open}"><input type="time" id="sc" value="${cfg.close}"></div>
  <p class="mut">استراحة يومية (اختياري)</p><div class="row"><input type="time" id="bf" value="${cfg.bf||''}"><input type="time" id="bt" value="${cfg.bt||''}"></div>
  <p class="mut">مدة الموعد بالدقائق</p><input type="number" id="du" min="10" step="5" value="${cfg.dur}">
  <p class="mut">أيام الإجازة</p><div class="wk">${DN.map((n,i)=>`<label><input type="checkbox" value="${i}" ${cfg.off.includes(i)?'checked':''}>${n}</label>`).join('')}</div>
  <button id="ss">حفظ الإعدادات</button></div><button class="ghost" id="out" style="width:100%">تسجيل خروج</button>`;
  $('#dp').onchange=e=>{sel=e.target.value||sel;admin()};
  $('#cl').onclick=async()=>{await db.doc('days/'+sel).set({...(c.closed?{closed:false}:{closed:true}),open:c.open,close:c.close},{merge:true});admin()};
  $('#sd').onclick=async()=>{await db.doc('days/'+sel).set({open:$('#o').value,close:$('#c').value,closed:false},{merge:true});admin()};
  $('#ss').onclick=async()=>{const off=[...document.querySelectorAll('.wk input:checked')].map(x=>+x.value);
    await db.doc('settings/config').set({open:$('#so').value,close:$('#sc').value,dur:+$('#du').value||30,bf:$('#bf').value,bt:$('#bt').value,off});admin()};
  $('#out').onclick=()=>au.signOut();
  $('#sl').onclick=async e=>{const b=e.target.closest('.slot');if(!b)return;
    if(b.dataset.c){if(!confirm('إلغاء هالحجز؟'))return;const x=db.batch();x.delete(db.doc('bookings/'+b.dataset.c));x.delete(db.doc('slots/'+b.dataset.c));await x.commit()}
    else{const id=b.dataset.b,r=db.doc('slots/'+id);blocked.has(id)?await r.delete():await r.set({date:sel,blocked:true})}
    admin()};
}
function route(){
  if(location.hash==='#admin'){$('#lnk').textContent='صفحة الزبائن';$('#lnk').href='#';
    au.currentUser?admin():loginView()}
  else{$('#lnk').textContent='دخول المالك';$('#lnk').href='#admin';customer()}
}
window.addEventListener('hashchange',route);
au.onAuthStateChanged(()=>route());
</script>
</body>
</html>
